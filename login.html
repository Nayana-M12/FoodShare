<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodShare</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-page">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-leaf"></i>
                <span>FoodShare</span>
            </div>
            <a href="index.html" class="nav-link" style="margin-left: auto;">Home</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-leaf"></i>
                <span>FoodShare</span>
            </div>

            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your account</p>

            <form id="loginForm" class="auth-form">
                <!-- Email -->
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="your.email@example.com" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Role Selection -->
                <div class="form-group">
                    <label>Login As</label>
                    <div class="role-grid">
                        <label class="role-option">
                            <input type="radio" name="role" value="donor" checked>
                            <span>Donor</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="ngo">
                            <span>NGO</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="volunteer">
                            <span>Volunteer</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="admin">
                            <span>Admin</span>
                        </label>
                    </div>
                </div>

                <!-- Remember & Forgot -->
                <div class="form-remember">
                    <label>
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>

            <!-- Sign Up Link -->
            <p class="auth-footer">
                Don't have an account? <a href="register.html">Sign up</a>
            </p>

            <!-- Demo Note -->
            <div class="demo-note">
                <strong>✅ Now Working:</strong> Register an account and log in with real MySQL credentials.
            </div>
        </div>
    </div>

    <footer class="footer-mini">
        <p>&copy; 2024 FoodShare. All rights reserved.</p>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.classList.remove('fa-eye');
                toggleBtn.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleBtn.classList.remove('fa-eye-slash');
                toggleBtn.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);

            try {
                const result = await apiRequest('login.php', {
                    data: formData,
                });

                const user = result.data?.user || {};
                if (user.email) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                }

                appToast(result.message || 'Login successful.', 'success');

                const redirectTarget = normalizeFrontendPath(
                    result.data?.redirect || dashboardPathForRole(user.role || formData.get('role'))
                );
                window.location.href = redirectTarget;
            } catch (error) {
                appToast(error.message || 'Login failed.', 'error');
            }
        });
    </script>
</body>
</html>
