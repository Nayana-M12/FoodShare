<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodShare</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-page">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-leaf"></i>
                <span>FoodShare</span>
            </div>
            <a href="index.html" class="nav-link" style="margin-left: auto;">Home</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-leaf"></i>
                <span>FoodShare</span>
            </div>

            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your account</p>

            <form id="loginForm" class="auth-form">
                <!-- Email -->
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="your.email@example.com" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Role Selection -->
                <div class="form-group">
                    <label>Login As</label>
                    <div class="role-grid">
                        <label class="role-option">
                            <input type="radio" name="role" value="donor" checked>
                            <span>Donor</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="ngo">
                            <span>NGO</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="volunteer">
                            <span>Volunteer</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="admin">
                            <span>Admin</span>
                        </label>
                    </div>
                </div>

                <!-- Remember & Forgot -->
                <div class="form-remember">
                    <label>
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>

            <!-- Sign Up Link -->
            <p class="auth-footer">
                Don't have an account? <a href="register.html">Sign up</a>
            </p>

            <!-- Demo Note -->
            <div class="demo-note">
                <strong>✅ Now Working:</strong> Register an account and login with real credentials! Data stored locally.
            </div>
        </div>
    </div>

    <footer class="footer-mini">
        <p>&copy; 2024 FoodShare. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.classList.remove('fa-eye');
                toggleBtn.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleBtn.classList.remove('fa-eye-slash');
                toggleBtn.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.querySelector('input[name="email"]').value.trim();
            const password = document.querySelector('input[name="password"]').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            
            // Validation
            if (!email) {
                appToast('Please enter your email.', 'error');
                return;
            }
            if (!password) {
                appToast('Please enter your password.', 'error');
                return;
            }
            
            // Get registered users from localStorage
            const users = JSON.parse(localStorage.getItem('foodShareUsers') || '[]');
            
            // Check if user exists with matching credentials
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                // Check if selected role matches registered role
                if (user.userType !== role) {
                    appToast('Login successful in demo view as ' + role.toUpperCase() + '.', 'warning', 2600);
                }
                
                // Login successful
                appToast('Login successful. Welcome ' + user.fullName + '.', 'success');
                
                // Store current user session
                localStorage.setItem('currentUser', JSON.stringify({
                    fullName: user.fullName,
                    email: user.email,
                    userType: role
                }));
                
                // Redirect to dashboard
                const dashboardMap = {
                    donor: 'donor-dashboard.html',
                    ngo: 'ngo-dashboard.html',
                    volunteer: 'volunteer-dashboard.html',
                    admin: 'admin-dashboard.html'
                };
                
                window.location.href = dashboardMap[role];
            } else {
                // Check if email exists but password is wrong
                if (users.some(u => u.email === email)) {
                    appToast('Incorrect password. Please try again.', 'error');
                } else {
                    // Demo mode: unknown email can still proceed to selected role dashboard
                    appToast('Demo login successful as ' + role.toUpperCase() + '.', 'success');

                    const dashboardMap = {
                        donor: 'donor-dashboard.html',
                        ngo: 'ngo-dashboard.html',
                        volunteer: 'volunteer-dashboard.html',
                        admin: 'admin-dashboard.html'
                    };

                    localStorage.setItem('currentUser', JSON.stringify({
                        fullName: 'Demo User',
                        email: email,
                        userType: role
                    }));

                    setTimeout(function() {
                        window.location.href = dashboardMap[role];
                    }, 500);
                }
            }
        });
    </script>
</body>
</html>
