<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FoodShare</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-page">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-leaf"></i>
                <span>FoodShare</span>
            </div>
            <a href="index.html" class="nav-link" style="margin-left: auto;">Home</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-leaf"></i>
                <span>FoodShare</span>
            </div>

            <h2>Create Account</h2>
            <p class="auth-subtitle">Choose your role to get started</p>

            <!-- Step 1: User Type Selection -->
            <div id="step1" class="register-step active">
                <h3>Choose Your Role</h3>
                <div class="user-type-grid">
                    <button type="button" class="user-type-btn" data-type="donor">
                        <i class="fas fa-utensils"></i>
                        <h4>I am a Food Donor</h4>
                        <p>Restaurant, hotel, or food business</p>
                    </button>
                    <button type="button" class="user-type-btn" data-type="ngo">
                        <i class="fas fa-handshake"></i>
                        <h4>I am an NGO</h4>
                        <p>Non-profit organization</p>
                    </button>
                    <button type="button" class="user-type-btn" data-type="volunteer">
                        <i class="fas fa-heart"></i>
                        <h4>I am a Volunteer</h4>
                        <p>Help deliver food</p>
                    </button>
                </div>
            </div>

            <!-- Step 2: Registration Form -->
            <div id="step2" class="register-step">
                <button type="button" class="btn-back" onclick="backToStep1()">← Back to role selection</button>
                
                <form id="registerForm" class="auth-form" novalidate>
                    <h3>Basic Information</h3>

                    <!-- Full Name -->
                    <div class="form-group">
                        <label>Full Name *</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" name="fullName" placeholder="John Doe" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label>Email Address *</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" name="email" placeholder="your.email@example.com" required>
                        </div>
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <div class="input-group">
                            <i class="fas fa-phone"></i>
                            <input type="tel" name="phone" placeholder="+1 (555) 123-4567" required>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="form-group">
                        <label>Address *</label>
                        <div class="input-group">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" name="address" placeholder="123 Street Name" required>
                        </div>
                    </div>

                    <!-- City -->
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" name="city" placeholder="New York" required>
                    </div>

                    <!-- Role-Specific Fields -->
                    <div id="donorFields" class="role-specific-fields" style="display: none;">
                        <h3>Restaurant Information</h3>
                        <div class="form-group">
                            <label>Restaurant/Business Name *</label>
                            <input type="text" name="restaurantName" placeholder="Your Restaurant Name">
                        </div>
                    </div>

                    <div id="ngoFields" class="role-specific-fields" style="display: none;">
                        <h3>Organization Information</h3>
                        <div class="form-group">
                            <label>Organization Name *</label>
                            <input type="text" name="organizationName" placeholder="Organization Name">
                        </div>
                        <div class="form-group">
                            <label>Registration Number *</label>
                            <input type="text" name="registrationNumber" placeholder="Registration Number">
                        </div>
                    </div>

                    <div id="volunteerFields" class="role-specific-fields" style="display: none;">
                        <h3>Volunteer Information</h3>
                        <div class="form-group">
                            <label>Experience with Food Delivery *</label>
                            <select name="experience" required>
                                <option value="">Select experience level</option>
                                <option value="none">No experience</option>
                                <option value="some">Some experience</option>
                                <option value="experienced">Very experienced</option>
                            </select>
                        </div>
                    </div>

                    <!-- Security -->
                    <h3>Security</h3>
                    <div class="form-group">
                        <label>Password *</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="confirmPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="form-checkbox">
                        <label>
                            <input type="checkbox" required>
                            <span>I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></span>
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                </form>
            </div>

            <!-- Sign In Link -->
            <p class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <footer class="footer-mini">
        <p>&copy; 2024 FoodShare. All rights reserved.</p>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        let selectedUserType = null;

        // User type selection
        document.querySelectorAll('.user-type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                selectedUserType = this.dataset.type;
                goToStep2();
            });
        });

        function goToStep2() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            
            // Show/hide role-specific fields
            document.querySelectorAll('.role-specific-fields').forEach(field => {
                field.style.display = 'none';
            });
            
            if (selectedUserType === 'donor') {
                document.getElementById('donorFields').style.display = 'block';
            } else if (selectedUserType === 'ngo') {
                document.getElementById('ngoFields').style.display = 'block';
            } else if (selectedUserType === 'volunteer') {
                document.getElementById('volunteerFields').style.display = 'block';
            }
        }

        function backToStep1() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
        }

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!selectedUserType) {
                appToast('Please choose a role before creating your account.', 'error');
                return;
            }
            
            // Get form data
            const fullName = document.querySelector('input[name="fullName"]').value.trim();
            const email = document.querySelector('input[name="email"]').value.trim();
            const phone = document.querySelector('input[name="phone"]').value.trim();
            const address = document.querySelector('input[name="address"]').value.trim();
            const city = document.querySelector('input[name="city"]').value.trim();
            const password = document.querySelector('input[name="password"]').value;
            const confirmPassword = document.querySelector('input[name="confirmPassword"]').value;
            const termsAccepted = document.querySelector('input[type="checkbox"]').checked;
            
            // Validation
            if (!fullName) {
                appToast('Please enter your full name.', 'error');
                return;
            }
            if (!email) {
                appToast('Please enter your email.', 'error');
                return;
            }
            if (!email.includes('@')) {
                appToast('Please enter a valid email.', 'error');
                return;
            }
            if (!phone) {
                appToast('Please enter your phone number.', 'error');
                return;
            }
            if (!address) {
                appToast('Please enter your address.', 'error');
                return;
            }
            if (!city) {
                appToast('Please enter your city.', 'error');
                return;
            }
            if (!password) {
                appToast('Please enter a password.', 'error');
                return;
            }
            if (password.length < 6) {
                appToast('Password must be at least 6 characters.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                appToast('Passwords do not match.', 'error');
                return;
            }
            if (!termsAccepted) {
                appToast('You must accept the Terms and Conditions.', 'error');
                return;
            }
            
            // Check role-specific fields
            if (selectedUserType === 'donor') {
                const restaurantName = document.querySelector('input[name="restaurantName"]').value.trim();
                if (!restaurantName) {
                    appToast('Please enter your restaurant or business name.', 'error');
                    return;
                }
            } else if (selectedUserType === 'ngo') {
                const orgName = document.querySelector('input[name="organizationName"]').value.trim();
                const regNum = document.querySelector('input[name="registrationNumber"]').value.trim();
                if (!orgName) {
                    appToast('Please enter your organization name.', 'error');
                    return;
                }
                if (!regNum) {
                    appToast('Please enter your registration number.', 'error');
                    return;
                }
            } else if (selectedUserType === 'volunteer') {
                const experience = document.querySelector('select[name="experience"]').value;
                if (!experience) {
                    appToast('Please select your experience level.', 'error');
                    return;
                }
            }
            
            const payload = {
                role: selectedUserType,
                fullName: fullName,
                email: email,
                phone: phone,
                address: address,
                city: city,
                password: password,
                confirmPassword: confirmPassword,
            };

            if (selectedUserType === 'donor') {
                payload.restaurantName = document.querySelector('input[name="restaurantName"]').value.trim();
            } else if (selectedUserType === 'ngo') {
                payload.organizationName = document.querySelector('input[name="organizationName"]').value.trim();
                payload.registrationNumber = document.querySelector('input[name="registrationNumber"]').value.trim();
            } else if (selectedUserType === 'volunteer') {
                payload.experience = document.querySelector('select[name="experience"]').value;
            }

            try {
                const result = await apiRequest('register.php', {
                    data: payload,
                });

                appToast(result.message || 'Account created successfully.', 'success');
                setTimeout(function() {
                    window.location.href = normalizeFrontendPath(result.data?.redirect || 'login.html');
                }, 900);
            } catch (error) {
                appToast(error.message || 'Registration failed.', 'error');
            }
        });
    </script>
</body>
</html>
